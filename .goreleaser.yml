version: 2

project_name: termlife

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: termlife
    main: .
    binary: termlife
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

archives:
  - id: termlife
    ids:
      - termlife
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: termlife
    repository:
      owner: ticktockbent
      name: homebrew-tap
      # GITHUB_TOKEN can't push to another repo; needs a PAT with access to homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/ticktockbent/termlife
    description: Terminal-based Game of Life implementation
    license: MIT
    test: |
      system "#{bin}/termlife", "--version"

# Snapcraft for Linux (snap install termlife)
# snapcrafts:
#   - name: termlife
#     summary: Terminal-based Game of Life
#     description: |
#       A terminal-based Game of Life implementation in Go.
#       Single binary, zero config, just works.
#     grade: stable
#     confinement: strict
#     license: MIT

# AUR for Arch Linux - requires separate PKGBUILD repo
# aurs:
#   - name: termlife-bin
#     homepage: https://github.com/ticktockbent/termlife
#     description: Terminal-based Game of Life implementation
#     license: MIT

# .deb and .rpm packages
nfpms:
  - id: termlife
    package_name: termlife
    vendor: ticktockbent
    homepage: https://github.com/ticktockbent/termlife
    maintainer: ticktockbent
    description: Terminal-based Game of Life implementation
    license: MIT
    # Versionless names so the README's releases/latest/download links resolve
    file_name_template: "{{ .PackageName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm

release:
  github:
    owner: ticktockbent
    name: termlife
  draft: false
  prerelease: auto
